# 生产编排（服务器）—— 宿主机 host 网络
# 镜像由 GitHub Actions 构建推送到 GHCR，服务器只拉取运行
# 宿主 Nginx 8881(SSL)：/ → 前端 27410，/server/ → 后端 10001
#
# 更新部署：
#   bash deploy.sh          # 拉镜像 + 滚动更新
#   bash deploy.sh migrate  # 数据库迁移

services:
  backend:
    image: ghcr.io/jh-tgbotmanage/adminserver:${ADMINSERVER_TAG:-latest}
    container_name: tg-admin-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      PORT: "10001"
      API_BASE_PATH: "/server/api"
    volumes:
      - ./logs/backend:/app/logs

  frontend:
    image: ghcr.io/jh-tgbotmanage/admin:${ADMIN_TAG:-latest}
    container_name: tg-admin-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
