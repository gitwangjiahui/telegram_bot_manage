# 生产编排（服务器 /app/tg-admin-panel）—— 宿主机 host 网络
# 复用宿主机 mysql8 容器（127.0.0.1:3306），不重复创建中间件
# 端口：27402 后端API / 27410 前端页面（前端容器内 Nginx 反代 /api）
#
# 部署：
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend node src/scripts/migrate.js

services:
  backend:
    build: ./backend
    container_name: tg-admin-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      PORT: "27402"
    volumes:
      - ./logs/backend:/app/logs

  frontend:
    build: ./frontend
    container_name: tg-admin-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
