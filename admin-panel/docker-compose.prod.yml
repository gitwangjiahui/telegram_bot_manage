# 生产编排（服务器 /app/telegram_bot_manage/admin-panel）—— 宿主机 host 网络
# 镜像由 GitHub Actions 构建推送到 GHCR，服务器只拉取运行，不在本机构建
# 复用宿主机 mysql8 容器（127.0.0.1:3306）
# 端口：27402 后端API / 27410 前端页面（前端容器内 Nginx 反代 /api）
#
# 更新部署：
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec backend node src/scripts/migrate.js

services:
  backend:
    image: ghcr.io/jh-tgbotmanage/adminserver:${ADMINSERVER_TAG:-latest}
    container_name: tg-admin-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      PORT: "27402"
    volumes:
      - ./logs/backend:/app/logs

  frontend:
    image: ghcr.io/jh-tgbotmanage/admin:${ADMIN_TAG:-latest}
    container_name: tg-admin-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
