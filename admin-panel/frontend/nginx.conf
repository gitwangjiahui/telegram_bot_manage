# 前端容器（host 网络）：仅提供静态文件，监听 11000
# /api 反代由宿主 Nginx 8881 的 /server/ 统一处理，容器内不做代理
server {
    listen 11000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML 不缓存：确保发布后浏览器立刻拿到引用新 hash chunk 的 index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # 带内容 hash 的静态资源可长期强缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
