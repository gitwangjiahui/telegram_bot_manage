server {
    listen 8881 ssl http2;
    server_name www.95qw.com;

    ssl_certificate     /etc/ssl/95qw.com/95qw.com.pem;
    ssl_certificate_key /etc/ssl/95qw.com/95qw.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    # 后端 API：/server/api/* → 127.0.0.1:10001/server/api/*
    # proxy_pass 不带 URI，保留完整原始路径（/server/ 前缀），与后端路由一致
    location /server/ {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端：根目录 → 前端容器 27410
    location / {
        proxy_pass http://127.0.0.1:27410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
