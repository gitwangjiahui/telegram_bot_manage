name: Build Admin Web Image

on:
  push:
    branches: [master]
    paths:
      - admin-panel/frontend/src/**
      - admin-panel/frontend/index.html
      - admin-panel/frontend/vite.config.js
      - admin-panel/frontend/Dockerfile
      - admin-panel/frontend/package.json
      - .github/workflows/admin-frontend.yml
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jh-tgbotmanage/admin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: admin-panel/frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
